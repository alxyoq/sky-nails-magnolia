<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sky Nails form endpoint</title>
  </head>
  <body>
    <form
      name="appointment-request"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="appointment-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="service" />
      <input name="when" />
      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
